<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Naše výlety ❤️</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6366f1">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">

<!-- Firebase App & Firestore (v9 compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-storage-compat.js"></script>
</head>
<body>

    <script>
    document.addEventListener("DOMContentLoaded", () => {
        if (sessionStorage.getItem("isLogged") === "true") {
            document.getElementById("login-overlay").style.display = "none";
        }
    });
    </script>

    <div id="user-status-bar" style="position: fixed; top: 10px; right: 10px; z-index: 9999; display: flex; align-items: center; gap: 10px;">
    <script>
        const userName = sessionStorage.getItem("userName");
        if(userName) {
            document.write(`
                <span style="font-size: 0.8rem; background: rgba(0,0,0,0.5); color: white; padding: 5px 10px; border-radius: 20px; backdrop-filter: blur(5px);">
                    👤 ${userName}
                </span>
                <button onclick="logout()" style="background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 0.8rem;">
                    Odhlásit
                </button>
            `);
        }
    </script>
</div>

    <div id="login-overlay">
      <div class="login-box">
          <h2 style="color: #ec4899; margin-bottom: 20px;">❤️ Náš Svět</h2>
          <input type="text" id="loginUser" class="login-input" placeholder="Jméno">
          <input type="password" id="loginPass" class="login-input" placeholder="Heslo">
          <button class="btn" style="width: 100%; margin-top: 15px;" onclick="doLogin()">Odemknout</button>
      </div>
  </div>

<header>
<h1 id="title">❤️ Naše výlety ❤️</h1>
<p id="subtitle">Plánování společných dobrodružství</p>
</header>

<div class="actions">
<a href="index.html" class="btn" style="background: #4b5563;">⬅ Zpět na rozcestí</a>
<button class="btn" onclick="renderCities()">🔍 Plánovat</button>
<button class="btn" onclick="generateItinerary()">🎒 Aktuální Víkend</button>
<button class="btn btn-success" onclick="renderPastTrips()">📸 Proběhlé výlety</button>
<button class="btn" onclick="toggleDarkMode()">🌙 Temný mód</button>
<button class="btn btn-warning" onclick="document.getElementById('importJson').click()">📂 Import JSON</button>
<button class="btn btn-warning" onclick="exportData()">💾 Export JSON</button>
<input type="file" id="importJson" class="hidden" accept=".json" onchange="importData(event)">
<input type="file" id="photoInput" class="hidden" accept="image/*" multiple onchange="handlePhotos(event)">
</div>

<div class="container fade-in" id="main-content"></div>

<script src="app.js"></script>

<script>
let currentTripIdForPhoto = null;

function spawnHeart(x,y){
  const h=document.createElement("div");
  h.className="heart"; h.textContent="❤️";
  h.style.left=x+"px"; h.style.top=y+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1000);
}

function makeKey(type, city, name) { return encodeURIComponent(JSON.stringify({type, city, name})); }
function parseKey(key) { return JSON.parse(decodeURIComponent(key)); }

function toggleLike(key, e){
  requireAdmin(() => {
      if(liked.has(key)) liked.delete(key); else liked.add(key);
      saveState(); 
      if(e && e.stopPropagation) e.stopPropagation();
      const ev = e || window.event;
      spawnHeart(ev.clientX, ev.clientY);
      if(document.querySelector('.grid')) renderCities(); else generateItinerary();
  });
}

function renderCities(){
  const container = document.getElementById("main-content");
  // Přidání animace znovunačtením třídy
  container.className = "container"; 
  void container.offsetWidth; 
  container.classList.add("fade-in");

  let html = "";
  [...new Set([...data.hotels,...data.restaurants].map(i=>i.city))].forEach(city=>{
      html+=`<div class="city-title">${city}</div>`;
      html+=`<div class="map"><iframe src="https://www.google.com/maps?q=${city}&output=embed" loading="lazy"></iframe></div>`;
      html+=`<div class="grid">`;
      data.hotels.filter(h=>h.city===city).forEach(h=> html += createCard(h, "hotel", makeKey("hotel", h.city, h.name)));
      data.restaurants.filter(r=>r.city===city).forEach(r=> html += createCard(r, "restaurant", makeKey("restaurant", r.city, r.name)));
      html+=`</div>`;
  });
  container.innerHTML = html;
}

function createCard(item, type, key){
  return `
  <div class="card">
  <button class="btn-like" onclick="toggleLike('${key}',event)">${liked.has(key)?"❤️":"👍"}</button>
  <div class="tag ${type}">${type}</div>
  <h3>${item.name}</h3>
  <p>${item.description}</p>
  <div class="rating">⭐ ${item.rating} / ${type==="hotel"?10:5}</div>
  ${type==="hotel"?`<div class="price">${item.price}</div>`:""}
  <a href="${item.link}" target="_blank">Otevřít</a>
  </div>`;
}

// Pomocná funkce pro uložení data
function saveTripDate(dateValue) {
  nextTripDate = dateValue;
  saveState();
  alert("Datum výletu uloženo! Podívejte se na odpočet na hlavní stránce. ❤️");
}

function cancelPlannedTrip() {
    requireAdmin(() => {
        if(confirm("Opravdu chceš zrušit aktuální plán? Všechny lajky zmizí.")) {
            liked.clear();
            nextTripDate = null;
            saveState();
            renderCities(); // Vrátíme se na výběr měst
        }
    });
}

function generateItinerary() {
    const container = document.getElementById("main-content");
    container.className = "container"; void container.offsetWidth; container.classList.add("fade-in");
    
    if(liked.size === 0){ 
        container.innerHTML="<div class='panel' style='text-align:center;'><h2>❤️ Zatím nic nevybráno</h2></div>"; 
        return; 
    }

    const selected = [...liked].map(k => parseKey(k));
    const hotels = selected.filter(i => i.type === "hotel");
    const rests = selected.filter(i => i.type === "restaurant");
    
    let html = `<div class="panel" style="text-align:center;">
        <h2>🎒 Plán na aktuální víkend ❤️</h2>
        
        <div style="background: rgba(99,102,241,0.1); padding: 15px; border-radius: 15px; margin: 20px auto; max-width: 300px;">
            <label style="display:block; font-weight:bold; margin-bottom: 5px; color: #4f46e5;">📅 Kdy vyrážíme?</label>
            <input type="datetime-local" class="login-input" onchange="saveTripDate(this.value)" value="${nextTripDate || ''}">
        </div>

        <hr style="margin: 15px 0; opacity:0.3;">`;

    if(hotels.length === 1 && rests.length === 1) {
        const h = hotels[0]; const r = rests[0];
        const isSameCity = h.city === r.city;

        html += `<div style="text-align:left; max-width:400px; margin: 0 auto 20px;">
            <p>🏨 <b>Hotel:</b> ${h.name} (${h.city})</p>
            <p>🍽️ <b>Restaurace:</b> ${r.name} (${r.city})</p>
        </div>`;

        if(!isSameCity) html += `
            <div style="background: #fffbeb; border: 1px solid #f59e0b; padding: 15px; border-radius: 15px; margin-bottom: 20px; color: #92400e;">
                ⚠️ <b>Pozor:</b> Vybraná místa nejsou ve stejném městě! <br> 
                Z ${h.city} do ${r.city} to může být kus cesty.
            </div>`;
        else html += `<p style="color:#10b981; margin-bottom:15px;">✨ Skvělá volba!</p>`;

        html += `
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
                <button class="btn btn-success" onclick="approveTrip()">✅ Zrealizovat a archivovat</button>
                <button class="btn" style="background: #64748b;" onclick="cancelPlannedTrip()">❌ Zrušit tento plán</button>
            </div>
        `;
    } else {
        html += `
            <p style="color:#ef4444; font-weight:bold; margin: 15px 0;">Vyberte přesně 1 hotel a 1 restauraci.</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn" onclick="renderCities()">Vrátit se k výběru</button>
                <button class="btn" style="background: #64748b;" onclick="cancelPlannedTrip()">🗑️ Vymazat výběr</button>
            </div>
        `;
    }
    container.innerHTML = html + `</div>`;
}

// Úprava funkce approveTrip pro vymazání odpočtu po schválení
function approveTrip() {
  requireAdmin(() => {
      const selected = [...liked].map(k => parseKey(k));
      const h = selected.find(i => i.type === "hotel");
      const r = selected.find(i => i.type === "restaurant");

      pastTrips.unshift({ id: Date.now(), city: h.city === r.city ? h.city : `${h.city} & ${r.city}`, hotel: h.name, restaurant: r.name, photos: [] });
      liked.clear(); 
      nextTripDate = null; 
      saveState(); 
      spawnHeart(window.innerWidth/2, window.innerHeight/2); 
      renderPastTrips();
  });
}

// --- DRAG & DROP LOGIKA ---
function allowDrop(ev) { ev.preventDefault(); ev.currentTarget.classList.add("drag-over"); }
function leaveDrop(ev) { ev.currentTarget.classList.remove("drag-over"); }
function drop(ev, tripId) {
  ev.preventDefault();
  ev.currentTarget.classList.remove("drag-over");
  if (ev.dataTransfer.files && ev.dataTransfer.files.length > 0) {
      currentTripIdForPhoto = tripId;
      processFiles(ev.dataTransfer.files);
  }
}

function renderPastTrips() {
  const container = document.getElementById("main-content");
  container.className = "container"; void container.offsetWidth; container.classList.add("fade-in");
  
  if(pastTrips.length === 0) { container.innerHTML="<div class='panel' style='text-align:center;'><h2>📸 Žádné proběhlé výlety</h2></div>"; return; }

  const tripsByCity = {};
  pastTrips.forEach(t => { if(!tripsByCity[t.city]) tripsByCity[t.city] = []; tripsByCity[t.city].push(t); });

  let html = `<div class="panel"><h2>📸 Naše proběhlé výlety</h2><p style="font-size:0.8rem; color:#6b7280; margin-bottom:15px;">Tip: Fotky můžete nahrát přes tlačítko, nebo je jednoduše přetáhnout myší přímo do rámečku výletu!</p>`;
  for (const [city, trips] of Object.entries(tripsByCity)) {
      html += `<h3 style="color:#ec4899; margin-top:20px; border-bottom:1px solid #ec4899; padding-bottom:5px;">${city}</h3>`;
      trips.forEach(trip => {
          html += `<div class="past-trip" ondrop="drop(event, ${trip.id})" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
              <p>🏨 <b>Hotel:</b> ${trip.hotel}</p>
              <p>🍽️ <b>Restaurace:</b> ${trip.restaurant}</p>
              <button class="btn btn-warning admin-only-btn" style="margin-top:10px; font-size:0.8rem; padding: 6px 12px;" onclick="triggerPhotoUpload(${trip.id})">📸 Přidat fotky</button>
              <button class="btn btn-danger admin-only-btn" style="margin-top:10px; font-size:0.8rem; padding: 6px 12px;" onclick="deleteTrip(${trip.id})">🗑️ Smazat výlet</button>
              <div class="gallery">
                  ${trip.photos.map((src, pIndex) => `
                      <div class="photo-card fade-in">
                          <img src="${src}" alt="Fotka" loading="lazy">
                          <button class="btn-delete-photo" onclick="deletePhoto(${trip.id}, ${pIndex})">×</button>
                      </div>`).join("")}
              </div>
          </div>`;
      });
  }
  container.innerHTML = html + `</div>`;
}

function triggerPhotoUpload(id) { currentTripIdForPhoto = id; document.getElementById('photoInput').click(); }

function handlePhotos(event) { processFiles(event.target.files); event.target.value = ""; }

async function processFiles(files) {
  if (!files.length || !currentTripIdForPhoto) return;
  const trip = pastTrips.find(t => t.id === currentTripIdForPhoto);
  if (!trip) return;

  // Najdeme tlačítko a ukážeme, že se načítá (nahrávání chvíli trvá)
  const uploadBtns = document.querySelectorAll('.admin-only-btn');
  let currentBtn = Array.from(uploadBtns).find(btn => btn.innerText.includes('📸'));
  const originalText = currentBtn ? currentBtn.innerText : '📸 Přidat fotky';
  if(currentBtn) {
      currentBtn.innerText = "⏳ Nahrávám...";
      currentBtn.disabled = true;
  }

  try {
      // Projdeme všechny vybrané/přetažené soubory
      for (const file of files) {
          if (!file.type.startsWith('image/')) continue; 
          
          // Vytvoříme unikátní cestu pro fotku (např. trips/12345/168000_fotka.jpg)
          const fileName = `trips/${trip.id}/${Date.now()}_${file.name}`;
          const storageRef = firebase.storage().ref().child(fileName);
          
          // 1. Nahrajeme fotku do Firebase Storage
          const snapshot = await storageRef.put(file);
          
          // 2. Získáme URL adresu nahrané fotky
          const downloadURL = await snapshot.ref.getDownloadURL();
          
          // 3. Uložíme jen URL adresu, ne obří soubor
          trip.photos.push(downloadURL);
      }
      
      // Jakmile jsou fotky nahrané, uložíme stav.
      // Tím se spustí onSnapshot a druhé polovičce se to hned ukáže na displeji!
      saveState(); 
      renderPastTrips();
      
  } catch (error) {
      console.error("Chyba při nahrávání:", error);
      alert("Fotku se nepodařilo nahrát. Zkontroluj připojení nebo Firebase pravidla.");
  } finally {
      if(currentBtn) {
          currentBtn.innerText = originalText;
          currentBtn.disabled = false;
      }
  }
}

function deletePhoto(tripId, photoIndex) { const trip = pastTrips.find(t => t.id === tripId); if(trip) { trip.photos.splice(photoIndex, 1); saveState(); renderPastTrips(); } }
function deleteTrip(tripId) { if(confirm("Opravdu smazat?")) { pastTrips = pastTrips.filter(t => t.id !== tripId); saveState(); renderPastTrips(); } }

function exportData() {
  const exportData = { likedPlaces: [...liked], pastTrips: pastTrips };
  const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportData));
  a.download = "nase-vylety.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function importData(event) {
  const file = event.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
      try {
          const imported = JSON.parse(e.target.result);
          liked = new Set(imported.likedPlaces || []); pastTrips = imported.pastTrips || []; saveState();
          if(pastTrips.length > 0) renderPastTrips(); else renderCities();
          alert("Data úspěšně načtena! 🎉");
      } catch(err) { alert("Chyba při načítání."); }
  };
  reader.readAsText(file);
}

// Zpoždění pro bezpečné načtení z Firebase, pokud existuje
setTimeout(() => renderCities(), 100);
</script>
</body>
</html>
