<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluecatův výšlap 🐱</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e0f2fe; flex-direction: column; }
        body.dark-mode { background: #0f172a; }
        canvas { display: none; background: white; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.1); }
        body.dark-mode canvas { background: #1e293b; }
        .menu-overlay { background: white; padding: 30px; border-radius: 20px; text-align: center; width: 90%; max-width: 400px; }
        body.dark-mode .menu-overlay { background: #1e293b; color: white; }
        .menu-btn { width: 100%; margin-bottom: 10px; display: block; box-sizing: border-box; }
        #game-info { display: none; text-align: center; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div id="main-menu" class="menu-overlay fade-in">
        <h1 style="color:#6366f1">Bluecatův výšlap 🐱</h1>
        
        <!-- Hlavní tlačítka -->
        <div id="menu-buttons">
            <button class="btn menu-btn" onclick="startGame()">▶️ Start</button>
            <button class="btn menu-btn" style="background:#8b5cf6;" onclick="showOptions()">⚙️ Možnosti</button>
            <button class="btn menu-btn" style="background:#64748b;" onclick="showLeaderboard()">🏆 Žebříček</button>
            <a href="hra.html" class="btn menu-btn" style="background:#4b5563;">⬅ Konec</a>
        </div>

        <!-- Žebříček -->
        <div id="leaderboard-section" style="display:none; margin-top:20px;">
            <h3 style="color:#6366f1">Top 5 Výšlapů</h3>
            <div id="leaderboard-content" style="text-align: left; font-size: 0.9rem; margin-bottom: 15px;"></div>
            <button class="btn menu-btn" style="background:#64748b;" onclick="toggleSection('menu-buttons')">Zpět</button>
        </div>

        <!-- MOŽNOSTI (skryté) -->
        <div id="options-section" style="display:none; margin-top:20px;">
            <h3 style="color:#8b5cf6">Možnosti</h3>
            
            <!-- Výběr ovládání -->
            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom: 10px;">Ovládání mobilu:</label>
                <select id="control-type" class="btn menu-btn" style="background: #f1f5f9; color: #1e293b;" onchange="handleControlChange(this.value)">
                    <option value="tilt">Naklánění (Gyroskop)</option>
                    <option value="touch">Dotyk (Vlevo/Vpravo)</option>
                </select>
            </div>

            <!-- Slider hlasitosti -->
            <div style="margin-bottom: 20px;">
                <label style="display:block; margin-bottom: 10px;">Hlasitost: <span id="vol-perc">50</span>%</label>
                <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.5" 
                    style="width: 100%; cursor: pointer;" oninput="handleVolumeChange(this.value)">
            </div>

            <button class="btn menu-btn" id="music-btn" onclick="handleMusicToggle()">Hudba: ZAPNUTO</button>
            <button class="btn menu-btn" style="background:#64748b;" onclick="toggleSection('menu-buttons')">Zpět</button>
        </div>
    </div>

    <div id="game-info">
        <h2 style="color: #0369a1; margin: 0;">Skóre: <span id="score">0</span></h2>
        <p style="font-size: 0.8rem; color: #64748b;">Šipky vlevo/vpravo nebo nakláněj mobil</p>
    </div>
    <canvas id="jumpCanvas"></canvas>

    <!-- Firestore Knihovny -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script src="app.js"></script>
    <script>
        // Nastavení specifické hudby pro tuto hru
        setGameMusic("skok-music.mp3");

        window.addEventListener('click', () => {
            playMusic();
        }, { once: true });

        // Nastavení tématu a UI
        if(localStorage.getItem("theme") === "dark") document.body.classList.add("dark-mode");
        // Synchronizace slideru při načtení menu
        function updateOptionsUI() {
            const vol = localStorage.getItem("musicVolume") || "0.5";
            const slider = document.getElementById('volume-slider');
            if (slider) {
                slider.value = vol;
                document.getElementById('vol-perc').innerText = Math.round(vol * 100);
            }
            const btn = document.getElementById('music-btn');
            if (btn) btn.innerText = musicEnabled ? "Hudba: ZAPNUTO 🔊" : "Hudba: VYPNUTO 🔇";
            const controlSelect = document.getElementById('control-type');
            if (controlSelect) controlSelect.value = mobileControlType;
        }

        // Volání při změně slideru
        function handleVolumeChange(val) {
            changeVolume(val); 
            document.getElementById('vol-perc').innerText = Math.round(val * 100);
            if (parseFloat(val) > 0 && !musicEnabled) {
                handleMusicToggle();
            }
        }

        // Nezapomeň zavolat updateOptionsUI() tam, kde otevíráš sekci možností!
        function showOptions() {
            toggleSection('options-section');
            updateOptionsUI();
        }

        const canvas = document.getElementById('jumpCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth > 400 ? 400 : window.innerWidth - 20;
        canvas.height = window.innerHeight - 150;

        let score = 0; let platforms = []; let player = {};
        let gravity = 0.4; let jumpStrength = -12; let gameLoop;
        let gameStarted = false;

        // UI Logika
        function toggleSection(sectionId) {
            document.getElementById('menu-buttons').style.display = 'none';
            document.getElementById('leaderboard-section').style.display = 'none';
            document.getElementById('options-section').style.display = 'none';
            document.getElementById(sectionId).style.display = 'block';
        }

        function handleMusicToggle() {
            let isPlaying = toggleGameMusic();
            document.getElementById('music-btn').innerText = isPlaying ? "Hudba: ZAPNUTO 🔊" : "Hudba: VYPNUTO 🔇";
        }

        function showLeaderboard() {
            toggleSection('leaderboard-section');
            loadLeaderboardHTML('skok', 'leaderboard-content');
        }

        function handleControlChange(val) {
            changeControlType(val);
        }

        // Herní logika
        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-info').style.display = 'block';
            canvas.style.display = 'block';
            
            score = 0;
            gameStarted = false; // Hra čeká na první skok
            
            // Hráče posuneme kousek nad první platformu, aby na ni nespadl hned
            player = { x: canvas.width/2 - 20, y: canvas.height - 100, w: 40, h: 40, vy: 0, vx: 0 };
            
            platforms = [];
            // První platforma přímo pod hráčem
            platforms.push({ x: canvas.width/2 - 30, y: canvas.height - 50, w: 60, h: 10 });
            
            // Zbytek náhodně
            for(let i=0; i<10; i++) {
                platforms.push({ 
                    x: Math.random() * (canvas.width - 60), 
                    y: i * (canvas.height / 10), // Menší rozestupy (výška děleno 10 místo 7)
                    w: 60, 
                    h: 10 
                });
            }
            
            playMusic();
            draw(); 
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Vykreslení platforem
            ctx.fillStyle = "#10b981";
            platforms.forEach(p => {
                ctx.beginPath();
                ctx.roundRect(p.x, p.y, p.w, p.h, 5);
                ctx.fill();
                
                // KOLIZE: Kočka padá dolů a narazí na plošinu
                if(player.vy > 0 && 
                player.x + 30 > p.x && 
                player.x + 10 < p.x + p.w && 
                player.y + 35 > p.y && 
                player.y + 35 < p.y + p.h + 10) {
                    player.vy = jumpStrength;
                }
            });

            // Vykreslení kočky
            ctx.fillStyle = "#6366f1";
            ctx.font = "40px Arial";
            ctx.fillText("🐱", player.x, player.y);

            if (!gameStarted) {
                const isDark = document.body.classList.contains("dark-mode");
                ctx.fillStyle = isDark ? "white" : "black";
                ctx.font = "bold 20px Arial";
                ctx.textAlign = "center";
                ctx.fillText("MEZERNÍK nebo DOTYK pro start", canvas.width / 2, canvas.height / 2);
                ctx.textAlign = "left";
            } else {
                player.vy += gravity;
                player.y += player.vy;
                player.x += player.vx;
            }

            // --- LOGIKA POSUNU A SKÓRE ---
            if(player.y < canvas.height / 2) {
                let diff = canvas.height / 2 - player.y;
                player.y += diff;
                
                // TADY SE PŘIČÍTÁ SKÓRE (podle toho, jak moc se posunula obrazovka)
                score += Math.round(diff); 
                console.log("Aktuální skóre:", score); // Sleduj v konzoli (F12)

                platforms.forEach(p => {
                    p.y += diff;
                    if(p.y > canvas.height) {
                        // Čím vyšší skóre, tím výše dáváme novou plošinu (obtížnost)
                        let diffOffset = Math.min(score / 100, 150);
                        p.y = 0 - diffOffset; 
                        p.x = Math.random() * (canvas.width - 60);
                        p.w = Math.max(60 - (score / 1000), 30); // Plošiny se zmenšují
                    }
                });
            }

            // Aktualizace textu na stránce
            const scoreElement = document.getElementById('score');
            if (scoreElement) {
                scoreElement.innerText = Math.floor(score / 10); // Dělíme 10, aby čísla nebyla obrovská
            }

            // Nekonečné okraje
            if(player.x > canvas.width) player.x = 0;
            if(player.x < 0) player.x = canvas.width;

            // Konec hry
            if(player.y > canvas.height) {
                cancelAnimationFrame(gameLoop);
                stopMusic();
                
                const finalScore = Math.floor(score / 10);
                
                // Vytvoříme asynchronní blok pro uložení
                async function handleGameOver() {
                    // Počkáme na uložení do databáze
                    await saveHighScore('skok', finalScore);
                    
                    // Teprve POTÉ ukážeme alert a restartujeme
                    alert("Pád! Tvé skóre: " + finalScore + "\nUloženo do žebříčku!");
                    location.reload();
                }
                
                handleGameOver();
                return; // Zastavíme další provádění draw
            } else {
                gameLoop = requestAnimationFrame(draw);
            }
        }

        canvas.addEventListener('touchstart', (e) => {
            if (!gameStarted) {
                gameStarted = true;
                player.vy = jumpStrength;
            }

            if (mobileControlType === "touch") {
                const touchX = e.touches[0].clientX;
                // Pokud klikne v levé polovině obrazovky, jede doleva
                if (touchX < window.innerWidth / 2) {
                    player.vx = -5;
                } else {
                    player.vx = 5;
                }
            }
        }, { passive: true });

        canvas.addEventListener('touchend', () => {
            if (mobileControlType === "touch") {
                player.vx = 0; // Po puštění zastaví
            }
        });

        window.addEventListener('keydown', e => {
            // START HRY MEZERNÍKEM NEBO ŠIPKAMI
            if (e.code === "Space" || e.key === "ArrowLeft" || e.key === "ArrowRight") {
                if (!gameStarted) {
                    gameStarted = true;
                    // Pokud hráč odstartoval mezerníkem, rovnou mu dáme první výskok
                    if (e.code === "Space") player.vy = jumpStrength;
                }
            }

            // POHYB
            if (e.key === "ArrowLeft") player.vx = -5;
            if (e.key === "ArrowRight") player.vx = 5;
            
        });
        window.addEventListener('keyup', () => player.vx = 0);
        window.addEventListener('deviceorientation', (e) => { 
            if (mobileControlType === "tilt") {
                if (Math.abs(e.gamma) > 5 && !gameStarted) gameStarted = true;
                player.vx = e.gamma / 5; 
            }
        });
        
    </script>
</body>
</html>
