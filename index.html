<title>Naše výlety ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#eef2ff,#fdf2f8);
  min-height:100vh;
  color:#1f2937;
  overflow-x:hidden;
}

/* 🌙 ROMANTIC MODE */
body.romantic{
  background:radial-gradient(circle at top,#1e1b4b,#0f172a);
  color:#f9fafb;
}

header{
  text-align:center;
  padding:60px 20px 20px;
}

header h1{
  font-size:3rem;
  background:linear-gradient(90deg,#6366f1,#ec4899);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

header p{color:#6b7280}
body.romantic header p{color:#c7d2fe}

.actions{text-align:center;margin:20px}

.btn{
  border:none;
  padding:10px 16px;
  border-radius:999px;
  background:linear-gradient(135deg,#6366f1,#ec4899);
  color:white;
  cursor:pointer;
  font-weight:600;
  margin:5px;
  box-shadow:0 6px 20px rgba(99,102,241,.3);
  transition:.2s;
}

.btn:hover{transform:translateY(-2px) scale(1.03)}

.container{max-width:1100px;margin:auto;padding:20px}

.city-title{
  font-size:1.5rem;
  margin-top:40px;
  color:#4f46e5;
}

/* 🧊 GLASS CARD */
.card{
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(12px);
  border-radius:20px;
  padding:18px;
  position:relative;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  transition:.25s;
}

/* ✨ HOVER MAGIC */
.card:hover{
  transform:rotateX(4deg) rotateY(-4deg) translateY(-8px);
  box-shadow:0 25px 50px rgba(236,72,153,.25);
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
  margin-top:10px;
}

.tag{
  font-size:.7rem;
  padding:4px 8px;
  border-radius:999px;
  color:white;
  display:inline-block;
  margin-bottom:6px;
}

.hotel{background:#6366f1}
.restaurant{background:#ec4899}

.rating{font-size:.85rem;margin:5px 0}
.price{color:#10b981;font-weight:600}

/* 🔘 BUTTON */
.card a{
  display:inline-block;
  margin-top:10px;
  padding:10px 14px;
  border-radius:999px;
  background:linear-gradient(135deg,#6366f1,#ec4899);
  color:white;
  text-decoration:none;
  font-weight:600;
  box-shadow:0 6px 15px rgba(99,102,241,.3);
}

/* ❤️ LIKE */
.btn-like{
  position:absolute;
  top:10px;
  right:10px;
  border:none;
  background:white;
  border-radius:999px;
  padding:5px 8px;
  cursor:pointer;
  z-index:20;
}

/* ❤️ FLOAT */
.heart{
  position:fixed;
  z-index:9999;
  pointer-events:none;
  animation:float 1s forwards;
}

@keyframes float{
  from{opacity:1;transform:translateY(0)}
  to{opacity:0;transform:translateY(-60px) scale(1.5)}
}

/* 🗺️ MAP */
.map{margin-top:10px;border-radius:15px;overflow:hidden}
iframe{width:100%;height:180px;border:0}

/* 🎒 ITINERARY */
.itinerary{
  margin-top:30px;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,.7);
  backdrop-filter:blur(10px);
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}

body.romantic .itinerary{background:rgba(255,255,255,.08)}

</style>

function toggleRomantic(){
document.body.classList.toggle("romantic");
}

function spawnHeart(x,y){
  const h=document.createElement("div");
  h.className="heart";
  h.textContent="❤️";

  h.style.left=x+"px";
  h.style.top=y+"px";

  h.style.position="fixed";
  h.style.zIndex="9999";

  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1000);
}

function toggleLike(key,e){
  if(liked.has(key)) liked.delete(key);
  else liked.add(key);

  localStorage.setItem("likedPlaces",JSON.stringify([...liked]));

  // stop bubbling
  if(e && e.stopPropagation) e.stopPropagation();

  const ev = e || window.event;
  spawnHeart(ev.clientX, ev.clientY);
  renderCities();
}

function createCard(item,type){
const key=type+item.name+item.city;

return `
<div class="card">
<button class="btn-like" onclick="toggleLike('${key}',event)">${liked.has(key)?"❤️":"👍"}</button>
<div class="tag ${type}">${type}</div>
<h3>${item.name}</h3>
<p>${item.description}</p>
<div class="rating">⭐ ${item.rating} / ${type==="hotel"?10:5}</div>
${type==="hotel"?`<div class="price">${item.price}</div>`:""}
<a href="${item.link}" target="_blank">Otevřít</a>
</div>`;
}

function renderCities(){
document.getElementById("itinerary").innerHTML="";
const c=document.getElementById("cities");
c.innerHTML="";

[...new Set([...data.hotels,...data.restaurants].map(i=>i.city))]
.forEach(city=>{
let html=`<div class="city-title">${city}</div>`;
html+=`<div class="map"><iframe src="https://www.google.com/maps?q=${city}&output=embed"></iframe></div>`;
html+=`<div class="grid">`;

data.hotels.filter(h=>h.city===city).forEach(h=>html+=createCard(h,"hotel"));
data.restaurants.filter(r=>r.city===city).forEach(r=>html+=createCard(r,"restaurant"));

html+=`</div>`;
c.innerHTML+=html;
});
}

function generateItinerary(){
let selected=[...liked];
if(selected.length===0){document.getElementById("itinerary").innerHTML="❤️ Nic vybrané";return}

const encoded=encodeURIComponent(JSON.stringify(selected));
const url=location.origin+location.pathname+"?likes="+encoded;

document.getElementById("cities").innerHTML="";
document.getElementById("itinerary").innerHTML=`
<div class="itinerary">
<h2>🎒 Víkendový plán ❤️</h2>
<p>Vybrali jste ${selected.length} míst</p>
<button class="btn" onclick="navigator.clipboard.writeText('${url}')">💌 Sdílet plán</button>
</div>`;
}

renderCities();
</script>
