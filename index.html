<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plánovač výletů</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
      color: #1f2937;
    }

    header { text-align: center; padding: 60px 20px 40px; }

    header h1 {
      font-size: 3rem;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p { margin-top: 10px; color: #6b7280; }

    .container { max-width: 1100px; margin: auto; padding: 20px; }

    h2 { margin: 50px 0 15px; font-weight: 600; }

    .city-title {
      margin-top: 40px;
      font-size: 1.5rem;
      color: #4f46e5;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 25px;
      margin-top: 15px;
    }

    .card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: 0.3s ease;
    }

    .card:hover { transform: translateY(-8px) scale(1.02); }

    .card h3 { margin-bottom: 8px; }

    .city-label {
      font-size: 0.75rem;
      color: white;
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .tag-hotel {
      background: #6366f1;
    }

    .tag-restaurant {
      background: #ec4899;
    }

    .card p { color: #6b7280; font-size: 0.9rem; margin-bottom: 15px; }

    .card a {
      display: inline-block;
      padding: 8px 15px;
      border-radius: 999px;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      color: white;
      text-decoration: none;
      font-size: 0.85rem;
    }

    footer { text-align: center; padding: 30px; color: #9ca3af; font-size: 0.85rem; }
  </style>
</head>
<body>

<header>
  <h1>🌍 Plánovač výletu</h1>
  <p>Vyber si ideální kombinaci hotelu a jídla podle města</p>
</header>

  <label for="citySelect"><strong>Vyber město:</strong></label>

  </select>

  <h2>🌆 Města</h2>
  <div id="cities"></div>
  <div id="restaurants"></div>

</div>

<footer>
  Vytvořeno s ❤️ | Tvůj plánovač výletů

      { name: "Park Penzion", city: "Malá Morávka", link: "https://www.booking.com/Share-vz9Xr3s", description: "Park Penzion se nachází v Malé Morávce a nabízí ubytování s zahradou, neplaceným soukromým parkovištěm, terasou a barem. Praděd je 15 km daleko. Tento penzion má restauraci. Muzeum papíru Velké Losiny se nachází ve vzdálenosti 43 km. V ubytování Park Penzion mají všechny pokoje šatní skříň, TV s plochou obrazovkou, vlastní koupelnu, ložní prádlo a ručníky. Vlastní koupelna je vybavená sprchou a bezplatnými toaletními potřebami. V ubytování Park Penzion se připravuje snídaně formou bufetu a kontinentální snídaně. Park Penzion nabízí dětské hřiště. Během pobytu v ubytování Park Penzion se můžete v Malé Morávce a okolí věnovat různým aktivitám, jako je například peší turistika, lyžování a cyklistika. Letiště Leoše Janáčka Ostrava leží 91 km od ubytování. Hostům, kteří se zde ubytovali v páru, se velmi líbila lokalita – dali jí hodnocení 9,5." }
    ],
    restaurants: [
      { name: "Rožnovský Pivovar", city: "Rožnov pod Radhoštěm", link: "https://www.roznovskepivnilazne.cz/?ved=2ahUKEwiI7LWgvZeUAxU9bPEDHZQUFb0QgU96BAgYEAQ", description: "Možná jsou Rožnovské pivní lázně prvními lázněmi zcela nového druhu. Snažíme se totiž skloubit prvky alternativního léčitelství vycházejícího z prastarých technik starých Egypťanů a východních kultur s běžnými i méně běžnými lázeňskými a fyzioterapeutickými postupy. Díky osobním zkušenostem totiž hluboce věříme, že pouze skrze dosažení harmonie těla a duše lze žít šťastný život v lásce, radosti, zdraví, hojnosti a prosperitě." },
      { name: "Naše BISTRO Jeseník", city: "Jeseník", link: "https://nasebistrojesenik.cz/?lang=cs", description: "Naše nabídka s sebou vám umožní vychutnat si naše jídla z pohodlí vašeho domova. Naše zařízení má následující vybavení: venkovní servis, klimatizaci, parkoviště a Wifi zdarma. Zajišťujeme akce, pro více informací nás neváhejte kontaktovat. Každý je vítán v našem podniku, který je navržen tak, aby byl pro všechny snadno dostupný. Rádi ubytujeme i vaše mazlíčky. Pro platbu si můžete vybrat bezkontaktní, Mastercard a VISA. Kontaktujte nás pro rezervaci vašeho stolu." },
      { name: "Burgr's, Fresh Burger Bistro", city: "Hodonín", link: "https://www.burgrs.eu/?ved=2ahUKEwiD0ZGhv5eUAxWOSfEDHQ21Mr8QgU96BAgbEAQ", description: "Ano, máme rádi dobré jídlo a pití. Jsme ochotni za ním cestovat i stovky kilometrů. A proto jsme se rozhodli otevřít BURGR'S, fresh burger bistro, jelikož na opravdu dobré Burgry jsme v okolí nenarazili. Jsme zastánci toho, že zbytečná chemie do jídla nepatří a od toho se odvíjí veškeré naše dění. V BURGR'S Vám nabídneme jídlo a pití s čistým svědomím, které připravujeme i našim dětem." },
      { name: "Restaurace znamky", city: "Rýmařov", link: "https://restaurace-znamky.cz/", description: "V naší restauraci připravujeme tradiční česká jídla bez použití dochucovadel a polotovarů. Dbáme na čerstvost surovin. Od houskových knedlíků a bramborových noků - přes housky na hamburgery, špecle či krokety - vše si připravujeme v naší kuchyni sami. Stálému lístku dominuje svíčková a domácí borůvkové knedlíky z jesenických borůvek (je-li zrovna jejich sezóna). Ke Svijanskému mázu můžete mít konfit z kachního stehýnka s opečenými bramborovými škubánky nebo vepřová žebírka s fermentovaným zelným salátem. Každý den vaříme dvě polévky a minimálně tři obědová menu." },
      { name: "Bistro Hubertus", city: "Karlova Studánka", link: "https://share.google/5Jhznn3YlDs8U3L6T", description: "Vítejte v Bistru Hubertus, vašem oblíbeném místě pro rychlé a chutné občerstvení v malebné Karlově Studánce. Naše bistro je ideálním místem pro ty, kteří hledají skvělé jídlo v přátelském a uvolněném prostředí. Naše nabídka Specializujeme se na nabídku hotových jídel, která uspokojí vaši chuť na něco rychlého a zároveň chutného. V našem menu najdete široký výběr pokrmů, včetně oblíbených hamburgerů, párků v rohlíku a dalších pochoutek. Vždy se snažíme, aby každé jídlo bylo připraveno s důrazem na kvalitu a čerstvost." },
      { name: "Na hvězdě", city: "Malá Morávka", link: "https://www.nahvezde.cz/", description: "Penzion a restaurace Na Hvězdě se nachází na strategickém místě u nástupní stanice Praděd - Ovčárna a zároveň mezi středisky Studánka a Malá Morávka - Karlov. Nabízíme vynikající českou kuchyni a ubytování na samotě v našem prostorném apartmánu. " }
    ]
  };

  // získání unikátních měst
  function getCities() {
    const all = [...data.hotels, ...data.restaurants];
    return [...new Set(all.map(item => item.city))];
  }

  function groupByCity(items) {
    const grouped = {};
    items.forEach(item => {
      if (!grouped[item.city]) grouped[item.city] = [];
      grouped[item.city].push(item);
    });
    return grouped;
  }

  function renderCities(selectedCity = "all") {
    const container = document.getElementById("cities");
    container.innerHTML = "";

    const cities = getCities();

    cities.forEach(city => {
      if (selectedCity !== "all" && city !== selectedCity) return;

      const cityBlock = document.createElement("div");

      const title = document.createElement("div");
      title.className = "city-title";
      title.textContent = city;

      const grid = document.createElement("div");
      grid.className = "grid";

      const cityHotels = data.hotels.filter(h => h.city === city);
      const cityRestaurants = data.restaurants.filter(r => r.city === city);

      [
        ...cityHotels.map(h => ({...h, type: "hotel"})),
        ...cityRestaurants.map(r => ({...r, type: "restaurant"}))
      ].forEach(item => {
        const card = document.createElement("div");
        card.className = "card";

        const tagClass = item.type === "hotel" ? "tag-hotel" : "tag-restaurant";
        const tagText = item.type === "hotel" ? "Hotel" : "Restaurace";

        card.innerHTML = `
          <div class="city-label ${tagClass}">${tagText}</div>
          <h3>${item.name}</h3>
          <p>${item.description}</p>
          <a href="${item.link}" target="_blank">Otevřít</a>
        `;

        grid.appendChild(card);
      });

      cityBlock.appendChild(title);
      cityBlock.appendChild(grid);
      container.appendChild(cityBlock);
    });
  }

  function init() {
    const select = document.getElementById("citySelect");
    const cities = getCities();

    cities.forEach(city => {
      const option = document.createElement("option");
      option.value = city;
      option.textContent = city;
      select.appendChild(option);
    });

    select.addEventListener("change", () => {
      renderCities(select.value);
    });

    renderCities();
  }

  init();
</script>

</body>
</html>
