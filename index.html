<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Naše výlety ❤️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #eef2ff, #fdf2f8);
      color: #1f2937;
      overflow-x: hidden;
    }

    header { text-align: center; padding: 60px 20px 20px; }

    header h1 {
      font-size: 2.8rem;
      font-weight: 600;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p { margin-top: 10px; color: #6b7280; }

    .container { max-width: 1100px; margin: auto; padding: 20px; }

    .actions {
      text-align: center;
      margin: 10px 0 30px;
    }

    .btn {
      border: none;
      padding: 10px 15px;
      border-radius: 999px;
      cursor: pointer;
      background: linear-gradient(90deg, #6366f1, #ec4899);
      color: white;
      font-weight: 600;
      margin: 5px;
    }

    .city-title {
      margin-top: 40px;
      font-size: 1.6rem;
      color: #4f46e5;
    }

    /* 🧊 GLASSMORPHISM KARTY */
    .card {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      transition: 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover { transform: translateY(-6px); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }

    .city-label {
      font-size: 0.7rem;
      color: white;
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .tag-hotel { background: #6366f1; }
    .tag-restaurant { background: #ec4899; }

    .rating { font-size: 0.85rem; margin: 5px 0; }

    /* 🔥 HEZKÉ TLAČÍTKO OTEVŘÍT */
    .card a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: linear-gradient(135deg, #6366f1, #ec4899);
      color: white;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 6px 15px rgba(99, 102, 241, 0.25);
      transition: all 0.2s ease;
    }

    .card a:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(236, 72, 153, 0.25);
      filter: brightness(1.05);
    }

    .card a:active {
      transform: scale(0.97);
    }
    .price { font-weight: 600; color: #10b981; margin: 5px 0; }

    .btn-like {
      position: absolute;
      top: 10px;
      right: 10px;
      border: none;
      background: white;
      border-radius: 999px;
      padding: 5px 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      font-size: 14px;
      z-index: 2;
    }

    .liked { background: #fee2e2; }

    /* ❤️ ANIMACE SRDCE */
    .heart-float {
      position: absolute;
      font-size: 18px;
      animation: floatUp 1s ease-out forwards;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
    }

    .itinerary {
      margin-top: 30px;
      padding: 15px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    /* 🗺️ MAPA */
    .map {
      margin-top: 10px;
      border-radius: 15px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 200px;
      border: 0;
    }

    footer { text-align: center; padding: 30px; color: #9ca3af; font-size: 0.85rem; }
  </style>
</head>

  <h1>🌍 Naše výlety ❤️</h1>

</div>

function saveLikes() {
  localStorage.setItem("likedPlaces", JSON.stringify([...liked]));
}

function spawnHeart(x, y) {
  const heart = document.createElement("div");
  heart.className = "heart-float";
  heart.textContent = "❤️";
  heart.style.left = x + "px";
  heart.style.top = y + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 1000);
}

function toggleLike(key, btn, event) {
  if (liked.has(key)) liked.delete(key);
  else liked.add(key);

  saveLikes();
  renderCities();

  spawnHeart(event.clientX, event.clientY);
}

function createCard(item, type) {
  const card = document.createElement("div");
  card.className = "card";

  const key = type + item.name + item.city;
  const isLiked = liked.has(key);

  const tagClass = type === "hotel" ? "tag-hotel" : "tag-restaurant";
  const tagText = type === "hotel" ? "Hotel" : "Restaurace";

  const ratingHTML = type === "hotel"
    ? `<div class="rating">⭐ ${item.rating} / 10</div>`
    : `<div class="rating">⭐ ${item.rating} / 5</div>`;

  card.innerHTML = `
    <button class="btn-like" onclick="toggleLike('${key}', this, event)">${isLiked ? "❤️" : "👍"}</button>
    <div class="city-label ${tagClass}">${tagText}</div>
    <h3>${item.name}</h3>
    <p>${item.description}</p>
    ${ratingHTML}
    ${type === "hotel" ? `<div class="price">${item.price}</div>` : ""}
    <a href="${item.link}" target="_blank">Otevřít</a>
  `;

  return card;
}

function getCities() {
  return [...new Set([...data.hotels, ...data.restaurants].map(i => i.city))];
}

function renderCities() {
  document.getElementById("itinerary").innerHTML = "";
  const container = document.getElementById("cities");
  container.innerHTML = "";

  getCities().forEach(city => {
    const block = document.createElement("div");

    const title = document.createElement("div");
    title.className = "city-title";
    title.textContent = city;

    const map = document.createElement("div");
    map.className = "map";
    map.innerHTML = `<iframe src="https://www.google.com/maps?q=${encodeURIComponent(city)}&output=embed"></iframe>`;

    const grid = document.createElement("div");
    grid.className = "grid";

    [...data.hotels.filter(h => h.city === city).map(h => ({...h, type:"hotel"})),
     ...data.restaurants.filter(r => r.city === city).map(r => ({...r, type:"restaurant"}))]
    .forEach(item => grid.appendChild(createCard(item, item.type)));

    block.appendChild(title);
    block.appendChild(map);
    block.appendChild(grid);
    container.appendChild(block);
  });
}

function generateItinerary() {
  const container = document.getElementById("cities");
  const out = document.getElementById("itinerary");

  container.innerHTML = "";
  out.innerHTML = "";

  let selected = [];

  data.hotels.forEach(h => {
    const key = "hotel" + h.name + h.city;
    if (liked.has(key)) selected.push({ ...h, type: "hotel" });
  });

  data.restaurants.forEach(r => {
    const key = "restaurant" + r.name + r.city;
    if (liked.has(key)) selected.push({ ...r, type: "restaurant" });
  });

  if (selected.length === 0) {
    out.innerHTML = `<div class="itinerary">❤️ Nemáš nic vybrané</div>`;
    return;
  }

  const city = selected[0].city;

  const hotels = selected.filter(i => i.type === "hotel");
  const restaurants = selected.filter(i => i.type === "restaurant");

  out.innerHTML = `
    <div class="itinerary">
      <h2>🎒 Víkend v ${city}</h2>
      <h3>🏨 Hotel</h3>
      ${hotels.map(h => `<p>${h.name} ⭐ ${h.rating}/10</p>`).join("")}
      <h3>🍽️ Restaurace</h3>
      ${restaurants.map(r => `<p>${r.name} ⭐ ${r.rating}/5</p>`).join("")}
    </div>
  `;
}

renderCities();

</script>

</body>
</html>
