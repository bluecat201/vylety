<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Náš Svět ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#eef2ff,#fdf2f8);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    transition: 0.5s;
  }
  body.romantic{ background:radial-gradient(circle at top,#1e1b4b,#0f172a); color:#f9fafb; }
  .hub-title {
    font-family: 'Dancing Script', cursive;
    font-size: 4.5rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg,#6366f1,#ec4899);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .hub-subtitle { font-size: 1.2rem; color: #6b7280; margin-bottom: 50px; }
  body.romantic .hub-subtitle { color: #c7d2fe; }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; max-width: 600px; width: 100%; padding: 20px; }
  .menu-item {
    background: rgba(255, 255, 255, 0.7);
    backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 30px;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    border: 2px solid transparent;
    transition: 0.3s;
    display: block;
  }
  .menu-item:hover { transform: translateY(-10px); border-color: #ec4899; box-shadow: 0 20px 40px rgba(236, 72, 153, 0.2); }
  .menu-item i { font-size: 3.5rem; display: block; margin-bottom: 15px; font-style: normal; }
  .menu-item h2 { color: #4f46e5; margin-bottom: 10px; }
  .btn-mode { margin-top: 30px; border:none; padding:10px 20px; border-radius:999px; background:#4f46e5; color:white; cursor:pointer; }
</style>
</head>
<body>
  <div class="container">
    <h1 class="hub-title">Náš Svět ❤️</h1>
    <p class="hub-subtitle">Všechna naše dobrodružství na jednom místě</p>
    
    <div class="menu-grid">
      <a href="vylety.html" class="menu-item">
        <i>🌍</i>
        <h2>Naše Výlety</h2>
        <p>Plánování, itineráře a vzpomínky z cest.</p>
      </a>
    </div>

    <button class="btn-mode" onclick="document.body.classList.toggle('romantic')">🌙 Přepnout mód</button>
  </div>
</body>
</html>
